name: Quran Long Video - Render, Upload & Schedule

on:
  workflow_dispatch:
    inputs:
      surah:
        description: "رقم السورة (1-114)"
        required: true
        default: "108"
        type: string
      publish_date:
        description: "تاريخ النشر بتوقيت الجزائر YYYY-MM-DD"
        required: true
        default: "2026-09-12"
        type: string
      publish_time:
        description: "وقت النشر بتوقيت الجزائر HH:MM"
        required: true
        default: "19:00"
        type: string

concurrency:
  group: quran-long-video-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies and Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests mutagen pillow arabic_reshaper python-bidi google-api-python-client google-auth google-auth-oauthlib

      - name: Install resvg
        run: |
          curl -L -o resvg.tar.gz https://github.com/linebender/resvg/releases/latest/download/resvg-linux-x86_64.tar.gz
          tar -xzf resvg.tar.gz
          find . -type f -name resvg -exec chmod +x {} \;
          RESVG_PATH="$(find . -type f -name resvg | head -n 1)"
          test -n "$RESVG_PATH"
          echo "$(dirname "$RESVG_PATH")" >> "$GITHUB_PATH"
          echo "[OK] resvg found at: $RESVG_PATH"

      - name: Validate and calculate publish time
        id: schedule
        env:
          SURAH: ${{ inputs.surah }}
          PUBLISH_DATE: ${{ inputs.publish_date }}
          PUBLISH_TIME: ${{ inputs.publish_time }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import os

          surah = int(os.environ["SURAH"])
          if not 1 <= surah <= 114:
              raise SystemExit("رقم السورة يجب أن يكون بين 1 و114")

          date_text = os.environ["PUBLISH_DATE"].strip()
          time_text = os.environ["PUBLISH_TIME"].strip()
          try:
              local_dt = datetime.strptime(
                  f"{date_text} {time_text}", "%Y-%m-%d %H:%M"
              ).replace(tzinfo=timezone(timedelta(hours=1)))
          except ValueError:
              raise SystemExit("التاريخ يجب أن يكون YYYY-MM-DD والوقت HH:MM")

          now = datetime.now(timezone.utc)
          if local_dt.astimezone(timezone.utc) <= now:
              raise SystemExit("موعد النشر يجب أن يكون في المستقبل")

          utc_dt = local_dt.astimezone(timezone.utc)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"surah={surah}\n")
              out.write(f"publish_at={utc_dt.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
              out.write(f"publish_local={local_dt.strftime('%Y-%m-%d %H:%M')}\n")

          print(f"[OK] Surah: {surah}")
          print(f"[OK] Algeria: {local_dt.strftime('%Y-%m-%d %H:%M')}")
          print(f"[OK] UTC: {utc_dt.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          PY

      - name: Restore YouTube credentials
        run: |
          printf '%s' '${{ secrets.YT_TOKEN }}' | base64 -d > token.pkl
          test -s token.pkl
          echo "[OK] YouTube token restored"

      - name: Render video
        env:
          SURAH: ${{ steps.schedule.outputs.surah }}
          OUTPUT_FILE: surah_${{ steps.schedule.outputs.surah }}_long.mp4
        run: |
          rm -rf audio_temp
          rm -f youtube_url.txt
          python quran_final.py \
            --surah "$SURAH" \
            --reciter ar.minshawi \
            --svg assets/Tile-Derivative-9.svg \
            --out "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"

      - name: Upload and schedule on YouTube
        env:
          VIDEO_FILE: surah_${{ steps.schedule.outputs.surah }}_long.mp4
          SURAH: ${{ steps.schedule.outputs.surah }}
          PUBLISH_AT: ${{ steps.schedule.outputs.publish_at }}
        run: python upload.py

      - name: Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_AT: ${{ steps.schedule.outputs.publish_at }}
          PUBLISH_LOCAL: ${{ steps.schedule.outputs.publish_local }}
          SURAH: ${{ steps.schedule.outputs.surah }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("BOT_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat:
              print("Telegram secrets missing; skipping notification")
              raise SystemExit(0)

          url = ""
          if os.path.exists("youtube_url.txt"):
              with open("youtube_url.txt", encoding="utf-8") as f:
                  url = f.read().strip()

          text = (
              "✅ تم رفع وجدولة فيديو القرآن بنجاح!\n\n"
              f"📖 السورة: {os.environ['SURAH']}\n"
              f"🇩🇿 موعد النشر: {os.environ['PUBLISH_LOCAL']}\n"
              f"🌍 UTC: {os.environ['PUBLISH_AT']}\n"
              f"🎙️ القارئ: محمد صديق المنشاوي\n"
              f"🔗 {url or 'تمت الجدولة بنجاح'}"
          )

          data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=data,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print("Telegram:", response.status)
          PY

      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-long-video-${{ github.run_number }}
          path: surah_*_long.mp4
          if-no-files-found: ignore
          retention-days: 2
