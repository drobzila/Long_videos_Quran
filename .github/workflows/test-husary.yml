name: Test Quran Video - Minshawi

on:
  workflow_dispatch:
    inputs:
      surah:
        description: "رقم السورة للتجربة"
        required: true
        default: "108"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies and Amiri font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig
          echo "[+] Amiri fonts installed:"
          fc-list | grep -i "Amiri" | head -n 10

      - name: Install Python dependencies
        run: pip install requests mutagen pillow arabic_reshaper python-bidi

      - name: Install resvg
        run: |
          curl -L -o resvg.tar.gz https://github.com/linebender/resvg/releases/latest/download/resvg-linux-x86_64.tar.gz
          tar -xzf resvg.tar.gz
          find . -type f -name resvg -exec chmod +x {} \\
          echo "$(dirname "$(find . -type f -name resvg | head -n 1)")" >> "$GITHUB_PATH"

      - name: Verify Quran Arabic font
        run: |
          python - <<'PY'
          from PIL import ImageFont
          path = "/usr/share/fonts/truetype/amiri/Amiri-Bold.ttf"
          font = ImageFont.truetype(path, 54)
          print(f"[OK] Arabic font loaded: {path}")
          print(f"[OK] Test bbox: {font.getbbox('بِسْمِ اللَّهِ')}")
          PY

      - name: Render Surah with Minshawi and new motif
        run: |
          python quran_final.py \\
            --surah ${{ inputs.surah }} \\
            --reciter ar.minshawi \\
            --svg assets/Tile-Derivative-9.svg \\
            --out surah_${{ inputs.surah }}_minshawi.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: surah-${{ inputs.surah }}-minshawi
          path: surah_${{ inputs.surah }}_minshawi.mp4
          retention-days: 3
